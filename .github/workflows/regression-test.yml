name: Regression testing

on: # yamllint disable-line rule:truthy
  workflow_dispatch: # Enables manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  BATCH_PROVIDER: openai
  BATCH_MODEL_NAME: ${{ vars.BATCH_MODEL_NAME }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_ENDPOINT: ${{ vars.OPENAI_ENDPOINT }}
  GEMINI_ENDPOINT: ${{ vars.GEMINI_ENDPOINT }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
  LANGFUSE_PUBLIC_KEY: ${{ vars.LANGFUSE_PUBLIC_KEY }}
  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
  LLAMA_GUARD_API_KEY: ${{ secrets.LLAMA_GUARD_API_KEY }}
  LLAMA_GUARD_ENDPOINT: ${{ vars.LLAMA_GUARD_ENDPOINT }}
  OPENAI_MODERATION_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  SKIP_CACHE: true

jobs:
  gen-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        round_number: [2, 3]
        chat_model:
          - gpt-4o-2024-08-06
          - gpt-5.3-chat-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install poetry
        run: |
          python -m pip install poetry==2.1.2

      - name: Configure poetry
        run: |
          python -m poetry config virtualenvs.in-project true

      - name: Set up cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cached-poetry-dependencies
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.14-${{ hashFiles('**/poetry.lock') }}-self-hosted

      - name: Install dependencies
        run: poetry install
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'

      - name: Generate dataset
        env:
          MODEL_API_KEY: ${{ startsWith(matrix.chat_model, 'gpt-') && secrets.OPENAI_API_KEY || secrets.GEMINI_API_KEY }}
          MODEL_ENDPOINT: ${{ startsWith(matrix.chat_model, 'gpt-') && vars.OPENAI_ENDPOINT || vars.GEMINI_ENDPOINT }}
          CHAT_COMPLETIONS_MODEL_NAME: ${{ matrix.chat_model }}
        run: |
          poetry run python generate_dataset.py --round-number=${{ matrix.round_number }} --tag=regression-pipeline

      - name: Archive data generation results to GitHub
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reg-test-gen-round-${{ matrix.round_number }}-${{ matrix.chat_model }}-${{ github.run_id }}
          path: |
            data/dataset/*.json

      - name: Setup Google Drive credentials
        uses: ./.github/actions/setup-gdrive
        with:
          credentials: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}

      - name: Upload data generation results to Google Drive
        env:
          GOOGLE_DRIVE_SHARED_DRIVE_ID: ${{ vars.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
        run: |
          poetry run python upload_to_gdrive.py "data/dataset/*.json" --target-path=dataset --drive-id="${GOOGLE_DRIVE_SHARED_DRIVE_ID}"

      - name: Dataset Generation Summary
        env:
          ROUND_NUMBER: ${{ matrix.round_number }}
          CHAT_MODEL: ${{ matrix.chat_model }}
        run: |
          {
            echo "## Dataset Generation Results - Round ${ROUND_NUMBER} - ${CHAT_MODEL}"
            echo "Generated datasets:"
            find data/dataset -maxdepth 1 -name "*.json" -exec ls -la {} + | while read -r line; do
              echo "- $line"
            done
            echo "Dataset count: $(find data/dataset -maxdepth 1 -name "*.json" | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
        if: ${{ !cancelled() }}

  eval-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: gen-data
    strategy:
      matrix:
        round_number: [2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install poetry
        run: |
          python -m pip install poetry==2.1.2

      - name: Configure poetry
        run: |
          python -m poetry config virtualenvs.in-project true

      - name: Set up cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cached-poetry-dependencies
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.14-${{ hashFiles('**/poetry.lock') }}-self-hosted

      - name: Install dependencies
        run: poetry install
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'

      - name: Download artifacts for current round
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reg-test-gen-round-${{ matrix.round_number }}-*-${{ github.run_id }}
          merge-multiple: true
          path: data/dataset

      - name: List downloaded artifacts
        run: |
          ls -R

      - name: Run regression tests
        env:
          MODEL_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_ENDPOINT: ${{ vars.OPENAI_ENDPOINT }}
          CHAT_COMPLETIONS_MODEL_NAME: ${{ vars.DEFAULT_CHAT_COMPLETIONS_MODEL_NAME }}
          LLM_AS_JUDGE_ENABLED: ${{ vars.LLM_AS_JUDGE_ENABLED }}
        timeout-minutes: 1440
        run: |
          poetry run python evaluate_dataset.py --round-number=${{ matrix.round_number }}

      - name: Archive data evaluation results to GitHub
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reg-test-eval-round-${{ matrix.round_number }}-${{ github.run_id }}
          path: |
            data/batch
            data/dataset/rated-*

      - name: Setup Google Drive credentials
        uses: ./.github/actions/setup-gdrive
        with:
          credentials: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}

      - name: Upload evaluation results to Google Drive
        env:
          GOOGLE_DRIVE_SHARED_DRIVE_ID: ${{ vars.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
        run: |
          poetry run python upload_to_gdrive.py "data/dataset/rated-*" --target-path=ratings --drive-id="${GOOGLE_DRIVE_SHARED_DRIVE_ID}"
          poetry run python upload_to_gdrive.py "data/batch/*" --target-path=batch --drive-id="${GOOGLE_DRIVE_SHARED_DRIVE_ID}"

      - name: Evaluation Summary
        env:
          ROUND_NUMBER: ${{ matrix.round_number }}
        run: |
          {
            echo "## Evaluation Results - Round ${ROUND_NUMBER}"
            echo "Batch files:"
            find data/batch -name "*.json" -o -name "*.jsonl" 2>/dev/null | while read -r file; do
              echo "- $file ($(wc -l < "$file" 2>/dev/null || echo "0") lines)"
            done || echo "No batch files found"
            echo ""
            echo "Rated datasets:"
            find data/dataset -maxdepth 1 -name "rated-*.json" 2>/dev/null | sort | while read -r file; do
              echo "- $file"
            done || echo "No rated datasets found"
          } >> "$GITHUB_STEP_SUMMARY"
        if: ${{ !cancelled() }}
