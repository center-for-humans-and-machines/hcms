name: Regression testing

on: # yamllint disable-line rule:truthy
  workflow_dispatch: # Enables manual trigger
  schedule:
    # Daily at 06:00 UTC (07:00 CET / 08:00 CEST, the tower's local time).
    # The jobs run on the Elderbot RCT tower's self-hosted runners, so the run
    # must stay clear of the tower's nightly maintenance: the reboot at 03:30
    # and the Docker/runner cache cleanup at 04:30 local time. Starting at
    # 06:00 UTC leaves about 20 hours for the Azure batch jobs before the next
    # maintenance window, in both winter and summer time.
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# Provider: Azure OpenAI for gpt-* models (BAN-1382). hcms picks the client
# from MODEL_ENDPOINT: a URL containing "azure" selects Azure OpenAI, which
# also needs MODEL_API_VERSION. Models whose name does not start with "gpt-"
# are routed to Gemini instead, so switching to Gemini only means changing
# the chat_model matrix and the Gemini variables.
env:
  BATCH_MODEL_NAME: ${{ vars.BATCH_MODEL_NAME }}
  MODEL_API_VERSION: ${{ vars.MODEL_API_VERSION }}
  GEMINI_ENDPOINT: ${{ vars.GEMINI_ENDPOINT }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
  LANGFUSE_PUBLIC_KEY: ${{ vars.LANGFUSE_PUBLIC_KEY }}
  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
  LLAMA_GUARD_API_KEY: ${{ secrets.LLAMA_GUARD_API_KEY }}
  LLAMA_GUARD_ENDPOINT: ${{ vars.LLAMA_GUARD_ENDPOINT }}
  # The moderation endpoint has no Azure equivalent, so it stays on OpenAI.
  OPENAI_MODERATION_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  SKIP_CACHE: true

jobs:
  gen-data:
    runs-on: ${{ vars.RUNNER == 'self-hosted' && 'self-hosted' || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Round 2 only (Park et al. conversation starters). Round 3 is left out
        # of the run but its code is kept; add 3 back here and in eval-data.
        round_number: [2]
        # On Azure the model name is the deployment name. gpt-5.3-chat-latest
        # is not deployed on the Azure resource, so it is left out until it is.
        chat_model:
          - gpt-4o-2024-08-06
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Poetry
        id: setup-poetry
        uses: center-for-humans-and-machines/github-actions/setup-poetry@4f961d7426d6969474be67c43c1b48579c717ecd # v1.1.0

      - name: Install dependencies
        run: poetry install
        if: steps.setup-poetry.outputs.cache-hit != 'true'

      - name: Generate dataset
        env:
          MODEL_API_KEY: ${{ startsWith(matrix.chat_model, 'gpt-') && secrets.AZURE_OPENAI_API_KEY || secrets.GEMINI_API_KEY }}
          MODEL_ENDPOINT: ${{ startsWith(matrix.chat_model, 'gpt-') && vars.AZURE_OPENAI_ENDPOINT || vars.GEMINI_ENDPOINT }}
          CHAT_COMPLETIONS_MODEL_NAME: ${{ matrix.chat_model }}
        run: |
          poetry run python generate_dataset.py --round-number=${{ matrix.round_number }} --tag=regression-pipeline

      - name: Archive data generation results to GitHub
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reg-test-gen-round-${{ matrix.round_number }}-${{ matrix.chat_model }}-${{ github.run_id }}
          path: |
            data/dataset/*.json

      - name: Setup Google Drive credentials
        uses: ./.github/actions/setup-gdrive # zizmor: ignore[self-repository] -- actionlint rejects $/ syntax
        with:
          credentials: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}

      - name: Upload data generation results to Google Drive
        env:
          GOOGLE_DRIVE_SHARED_DRIVE_ID: ${{ vars.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
        run: |
          poetry run python upload_to_gdrive.py "data/dataset/*.json" --target-path=dataset --drive-id="${GOOGLE_DRIVE_SHARED_DRIVE_ID}"

      - name: Dataset Generation Summary
        env:
          ROUND_NUMBER: ${{ matrix.round_number }}
          CHAT_MODEL: ${{ matrix.chat_model }}
        run: |
          {
            echo "## Dataset Generation Results - Round ${ROUND_NUMBER} - ${CHAT_MODEL}"
            echo "Generated datasets:"
            find data/dataset -maxdepth 1 -name "*.json" -exec ls -la {} + | while read -r line; do
              echo "- $line"
            done
            echo "Dataset count: $(find data/dataset -maxdepth 1 -name "*.json" | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
        if: ${{ !cancelled() }}

  eval-data:
    runs-on: ${{ vars.RUNNER == 'self-hosted' && 'self-hosted' || 'ubuntu-latest' }}
    permissions:
      contents: read
    needs: gen-data
    strategy:
      matrix:
        round_number: [2]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Poetry
        id: setup-poetry
        uses: center-for-humans-and-machines/github-actions/setup-poetry@4f961d7426d6969474be67c43c1b48579c717ecd # v1.1.0

      - name: Install dependencies
        run: poetry install
        if: steps.setup-poetry.outputs.cache-hit != 'true'

      - name: Download artifacts for current round
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reg-test-gen-round-${{ matrix.round_number }}-*-${{ github.run_id }}
          merge-multiple: true
          path: data/dataset

      - name: List downloaded artifacts
        run: |
          ls -R

      - name: Run regression tests
        env:
          MODEL_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          MODEL_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          CHAT_COMPLETIONS_MODEL_NAME: ${{ vars.DEFAULT_CHAT_COMPLETIONS_MODEL_NAME }}
          # Kill The Bot (KTB) judge on the Elderbot RCT tower's llama-server.
          LLM_AS_JUDGE_ENABLED: ${{ vars.LLM_AS_JUDGE_ENABLED }}
          LLM_JUDGE_ENDPOINT: ${{ vars.LLM_JUDGE_ENDPOINT }}
          LLM_JUDGE_MODEL: ${{ vars.LLM_JUDGE_MODEL }}
          LLM_JUDGE_API_KEY: ${{ secrets.LLM_JUDGE_API_KEY }}
          LLM_JUDGE_MAX_FAILED_SHARE: ${{ vars.LLM_JUDGE_MAX_FAILED_SHARE }}
        timeout-minutes: 1440
        run: |
          poetry run python evaluate_dataset.py --round-number=${{ matrix.round_number }}

      - name: Archive data evaluation results to GitHub
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Also when the KTB judge step fails, so its failed rows can be inspected.
        if: ${{ !cancelled() }}
        with:
          name: reg-test-eval-round-${{ matrix.round_number }}-${{ github.run_id }}
          path: |
            data/batch
            data/dataset/rated-*

      - name: Setup Google Drive credentials
        uses: ./.github/actions/setup-gdrive # zizmor: ignore[self-repository] -- actionlint rejects $/ syntax
        with:
          credentials: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}

      - name: Upload evaluation results to Google Drive
        env:
          GOOGLE_DRIVE_SHARED_DRIVE_ID: ${{ vars.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
        run: |
          poetry run python upload_to_gdrive.py "data/dataset/rated-*" --target-path=ratings --drive-id="${GOOGLE_DRIVE_SHARED_DRIVE_ID}"
          poetry run python upload_to_gdrive.py "data/batch/*" --target-path=batch --drive-id="${GOOGLE_DRIVE_SHARED_DRIVE_ID}"

      - name: Evaluation Summary
        env:
          ROUND_NUMBER: ${{ matrix.round_number }}
        run: |
          {
            echo "## Evaluation Results - Round ${ROUND_NUMBER}"
            echo "Batch files:"
            find data/batch -name "*.json" -o -name "*.jsonl" 2>/dev/null | while read -r file; do
              echo "- $file ($(wc -l < "$file" 2>/dev/null || echo "0") lines)"
            done || echo "No batch files found"
            echo ""
            echo "Rated datasets:"
            find data/dataset -maxdepth 1 -name "rated-*.json" 2>/dev/null | sort | while read -r file; do
              echo "- $file"
            done || echo "No rated datasets found"
          } >> "$GITHUB_STEP_SUMMARY"
        if: ${{ !cancelled() }}
