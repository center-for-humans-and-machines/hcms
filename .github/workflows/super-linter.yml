# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/github/super-linter
name: Lint

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null
  workflow_dispatch: # Enables manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          VALIDATE_ALL_CODEBASE: false
          # Lint pull requests against their target branch; other events use
          # the repository default branch
          DEFAULT_BRANCH: ${{ github.base_ref || 'dev' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CHECKOV: false
          VALIDATE_BASH_EXEC: false
          PYTHON_PYLINT_CONFIG_FILE: .pylintrc
          PYTHON_ISORT_CONFIG_FILE: pyproject.toml
          LINTER_RULES_PATH: .
          FIX_ENV: true
          FIX_SHELL_SHFMT: true
          FIX_YAML_PRETTIER: true
          FIX_PYTHON_ISORT: true
          FIX_PYTHON_RUFF: true
          FIX_JUPYTER_NBQA_ISORT: true
          FIX_JSON_PRETTIER: true
          VALIDATE_GIT_COMMITLINT: false
          VALIDATE_PYTHON_PYINK: false
          # Black and Biome conflict with the formatters this repo uses
          # (pyink and ruff-format for Python, Prettier for JSON)
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_BIOME_FORMAT: false
          # npm refuses to install pre-commit's git-based Node hooks (EALLOWGIT).
          # super-linter's MARKDOWN linter runs markdownlint instead.
          SKIP: markdownlint
          # Helm templates aren't valid YAML until rendered
          FILTER_REGEX_EXCLUDE: kubernetes/.*/templates/.*
