name: Functional testing

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null
  workflow_dispatch: # Enables manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  MODEL_API_KEY: dummy-key
  MODEL_ENDPOINT: dummy-endpoint
  BATCH_MODEL_NAME: dummy-batch-model
  CHAT_COMPLETIONS_MODEL_NAME: ${{ vars.CHAT_COMPLETIONS_MODEL_NAME }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Poetry
        id: setup-poetry
        uses: ./.github/actions/setup-poetry # zizmor: ignore[self-repository] -- actionlint rejects $/ syntax

      - name: Install Python package
        run: |
          ./script/install

      - name: Run pytest test suite
        run: |
          ./script/test

      - name: Test Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: ".test_report.xml"
          show: "fail"
        if: ${{ !cancelled() }}
