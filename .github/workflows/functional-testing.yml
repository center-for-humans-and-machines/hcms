name: Functional testing

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null
  workflow_dispatch: # Enables manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL_API_KEY: dummy-key
  MODEL_ENDPOINT: dummy-endpoint
  BATCH_MODEL_NAME: dummy-batch-model
  CHAT_COMPLETIONS_MODEL_NAME: ${{ vars.CHAT_COMPLETIONS_MODEL_NAME }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install poetry
        run: |
          python -m pip install poetry==2.1.2

      - name: Configure poetry
        run: |
          python -m poetry config virtualenvs.in-project true

      - name: Set up cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cached-poetry-dependencies
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.14-${{ hashFiles('**/poetry.lock') }}-self-hosted

      - name: Install Python package
        run: |
          ./script/install

      - name: Run pytest test suite
        run: |
          ./script/test

      - name: Test Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: ".test_report.xml"
          show: "fail"
        if: ${{ !cancelled() }}
