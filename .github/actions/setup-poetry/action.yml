name: Set up Poetry
description: Set up Python, install Poetry and restore the cached virtualenv

outputs:
  cache-hit:
    description: Whether the virtualenv was restored from the cache
    value: ${{ steps.cached-poetry-dependencies.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"

    - name: Install poetry
      shell: bash
      run: |
        python -m pip install poetry==2.1.2

    - name: Configure poetry
      shell: bash
      run: |
        python -m poetry config virtualenvs.in-project true

    - name: Set up cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cached-poetry-dependencies
      with:
        path: .venv
        key: venv-${{ runner.os }}-3.14-${{ hashFiles('**/poetry.lock') }}-self-hosted
